<!DOCTYPE html>
<html>
<head>
<title>TABLE</title>
<style>

body

{
margin:0px;
}

header
{
text-align:center;
text-transform:uppercase;
background:black;
color:white;
font-size:30px;
width:40%;
margin:auto;
padding:10px;
}

section
{
text-align:center;
width:90%;
margin:auto;

}



section table
{
padding:10px;
width:70%;
text-align:center;
margin:auto;
margin-top:80px;
background-color: #f4f6f9;
box-shadow:10px 10px 10px teal;
}

table tr:hover
{
cursor:pointer;
background-color: #ffeaa7;
box-shadow:10px 10px 10px gray;
transition:0.50s;
}

h2
{
text-align:center;
padding:10px;
text-transform:uppercase;
}
table td:hover
{
background:cyan;
transition:0.50s;
color:red;
}
</style>
<header>Creating Table In Html</header>
<h2>Student MarkSheet</h2>
</head>
<body>
<main>
<section>
<table border="1" cellpadding="10" cellspacing="2">
<tr>
<th>Roll NO</th><th>Name</th><th>Math</th><th>English</th><th>computer</th>
</tr>
<tr>
<td>001</td><td>Mukesh</td><td>100</td><td>100</td><td>100</td>
</tr>
<tr>
<td>002</td><td>Sanjay</td><td>45</td><td>84</td><td>99</td>
</tr>
<tr>
<td>003</td><td>Gaurav</td><td>75</td><td>88</td><td>77</td>
</tr>
<tr>
<td>004</td><td>Rajiv</td><td>65</td><td>89</td><td>77</td>
</tr>
<tr>
<td>005</td><td>Manoj</td><td>45</td><td>74</td><td>83</td>
</tr>
<tr>
<td>006</td><td>Deepak</td><td>86</td><td>54</td><td>43</td>
</tr>
<tr>
<td>007</td><td>Himanshu</td><td>74</td><td>84</td><td>97</td>
</tr>

</section>
</main>
</body>
</html>
