<!doctype html>
<html>
<head>
<title>audio video</title>

<style>

body
{
margin:0px;
font-family:Arial,sans-serif;
background-color:#111827;
}

header
{
background:linear-gradient(to right, #4facfe,#00f2fe);
padding:15px;
text-align:center;
color:white;
}

h1
{
margin:0px;
font-size:40px;
}

main
{
display:flex;
flex-direction:column;/*video ke niche audio*/
align-items:center;
padding-top:20px;
}

video
{
width:850px;
border-radius:20px;
box-shadow:0px 0px 20px black;
}

audio
{
width:850px;
}
video, audio
{
margin:15px;
}

</style>

<body>
<header>
<h1>Using Media Audio & Video</h1>
</header>

<main>
<video controls autoplay loop muted width="850">
<source src="images/vd.mp4"type="video/mp4">
</video>	


<audio controls autoplay loop muted>
<source src="images/ad.mp3"type="Audio/mp3">

</audio>
</body>
</main>
</html>
