<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<style>

body
{
text-align:center;
overflow:auto;
background-image:url("images/f3.jpg.jpeg");
}

h1
{
color:yellow;
}
</style>
<body>
    
<script>

var n = prompt("Enter a Number to create A table","2")

document.write("<h1>🌞Smart Multiplication Table🌞</h1>")
document.write("<h2> Table of "+n+"</h2>")

for(var i = 1;i<=10;i++)

{
document.write("<h1>"+n+" ❎ "+i+"="+n*i+"</h1>")
}

document.title=" No Error"

</script>
</body>
</html>
